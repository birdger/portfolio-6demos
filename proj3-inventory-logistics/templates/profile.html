{% extends 'base.html' %}
{% block title %}修改密码 - {{ APP_NAME }}{% endblock %}
{% block page_title %}修改密码{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
  <div class="card"><div class="card-body">
    <form method="post">
      <div class="mb-3"><label class="form-label">原密码</label><input class="form-control" type="password" name="old_pwd" required></div>
      <div class="mb-3"><label class="form-label">新密码(至少6位)</label><input class="form-control" type="password" name="new_pwd" required></div>
      <button class="btn btn-primary">保存</button>
    </form>
  </div></div>
</div></div>
{% endblock %}
