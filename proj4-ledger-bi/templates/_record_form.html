<form id="rec-form-{{ 'p-exp' if ttype == 'expense' else 'p-inc' }}" method="post" action="{{ url_for('record') }}">
  <input type="hidden" name="type" value="{{ ttype }}">
  <div class="row g-3">
    <div class="col-md-4"><label class="form-label small">金额（元）*</label>
      <input class="form-control" name="amount" type="number" step="0.01" min="0.01" placeholder="0.00" required></div>
    <div class="col-md-4"><label class="form-label small">日期 *</label>
      <input class="form-control" name="trans_date" type="date" value="{{ today }}" required></div>
    <div class="col-md-4"><label class="form-label small">账户</label>
      <select class="form-select" name="account_id">
        <option value="">不指定</option>
        {% for a in accounts %}<option value="{{ a.id }}">{{ a.name }}（{{ a.type }}）</option>{% endfor %}
      </select></div>
    <div class="col-md-8"><label class="form-label small">分类 *</label>
      <select class="form-select" name="category_id" required>
        <option value="">选择分类</option>
        {% for t in tree %}
          {% if t.type == ttype %}
          <optgroup label="{{ t.name }}">
            {% for c in t.children %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
          </optgroup>
          {% endif %}
        {% endfor %}
      </select></div>
    <div class="col-md-4"><label class="form-label small">备注</label>
      <input class="form-control" name="note" maxlength="80" placeholder="可选"></div>
  </div>
  <button class="btn btn-primary mt-3">保存账目</button>
</form>
